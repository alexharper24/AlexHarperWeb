<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<meta name="robots" content="noindex, nofollow"/>
<title>Harper Studio</title>
<meta name="theme-color" content="#0F1E2E"/>
<link rel="icon" type="image/png" href="assets/hs-favicon.png"/>
<link rel="apple-touch-icon" href="assets/hs-favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --navy:#0F1E2E; --navy-2:#0A1622; --navy-3:#1B3049;
    --gold:#C79A5A;
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* dvh so the card stays centred on a phone once the browser chrome collapses;
     100% alone resolves against an auto-height html element and centres nothing */
  body{min-height:100dvh}
  @supports not (height: 100dvh){ body{min-height:100vh} }
  body{
    font-family:var(--sans);
    color:#DFE6EF;
    background:
      radial-gradient(120% 140% at 14% -20%,var(--navy-3),var(--navy) 52%,var(--navy-2));
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 24px;
    -webkit-font-smoothing:antialiased;
  }
  /* the two metas plus this block keep iOS Safari from inverting the page */
  @media (prefers-color-scheme: dark){
    body{
      color:#DFE6EF;
      background:
        radial-gradient(120% 140% at 14% -20%,var(--navy-3),var(--navy) 52%,var(--navy-2));
    }
  }
  .card{width:100%;max-width:520px;text-align:center}
  .logo{height:46px;width:auto;display:block;margin:0 auto 36px;opacity:.92}
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(28px,4.6vw,38px);
    line-height:1.15;
    letter-spacing:-.02em;
    color:#fff;
  }
  .rule{
    width:56px;height:2px;
    background:var(--gold);
    margin:24px auto;
    border-radius:2px;
    opacity:.85;
  }
  p{
    font-size:clamp(15.5px,2vw,17px);
    line-height:1.7;
    color:#B9C4D2;
  }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/hs-logo-light.png" alt="Harper Studio" width="941" height="290"/>
    <h1>Down for maintenance.</h1>
    <div class="rule"></div>
    <p>This site is temporarily unavailable while scheduled work is carried out. It will be back shortly.</p>
  </main>
</body>
</html>
